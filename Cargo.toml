[workspace]
members = [
    "crates/aurora-core",
    "crates/aurora-ffi",
    "crates/aurora-rtmp",
    "crates/aurora-remote-desktop",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
libloading = "0.8"
crossbeam-channel = "0.5"
flume = "0.11"
parking_lot = "0.12"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
http = "1"
reqwest = { version = "0.12", features = ["json"] }
ratatui = "0.29"
crossterm = "0.28"

aurora-core = { path = "crates/aurora-core" }
aurora-ffi = { path = "crates/aurora-ffi" }
